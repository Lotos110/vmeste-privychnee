[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmeste-backend"
version = "0.1.0"
description = "Сервер приложения «Вместе привычнее» (MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "email-validator>=2.1,<3",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8,<3",
    "python-multipart>=0.0.9",
    "Pillow>=10.3",
    "APScheduler>=3.10,<4",
    "sqladmin>=0.20,<1",
    "itsdangerous>=2.1",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["content/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # Depends(...) в аргументах — норма для FastAPI; длину строк не режем
